[project]
name = "amaran-mcp"
version = "0.1.0"
description = "Drive an amaran light from a Mac with Claude Code, Cursor or GrokBot: studio lighting from a prompt, and a music mode that follows a trance track's sections, not its beat"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jtannahill", email = "161522526+jtannahill@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["amaran", "aputure", "mcp", "lighting", "music", "trance", "bluetooth-mesh", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "bleak>=3.0.2",
    "cryptography>=50.0.2",
    "mcp>=1.2",
    "numpy>=2.5.4",
    "sounddevice>=0.5.6",
    "websockets>=17.3",
]

[project.urls]
Homepage = "https://jtannahill.github.io/amaran-mcp/"
Repository = "https://github.com/jtannahill/amaran-mcp"
Research = "https://github.com/jtannahill/amaran-mcp/blob/main/docs/research.md"

[project.scripts]
amaran-mcp = "amaran_mcp:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]
